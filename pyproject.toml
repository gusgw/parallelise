[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parallelise"
version = "0.1.0"
description = "Turn a serial Python notebook into a verified parallel C kernel with a language-model agent, and measure how well different models and agent designs do it."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Angus Gray-Weale", email = "gusgw@gusgw.net"}]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# the two framework-based agent designs; the plain httpx agent needs nothing extra
agents = [
    "pydantic-ai>=1.0",
    "openai>=1.50",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-core>=1.0",
]
# the report generator's chart
report = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8", "mypy>=1.10"]

[project.scripts]
parallelise = "parallelise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parallelise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# make `tests.fake_model_server` importable however pytest is launched
pythonpath = ["."]
markers = [
    "slow: builds and runs C code; needs gcc with OpenMP",
    "mpi: needs mpicc and mpirun",
    "cuda: needs nvcc and a GPU",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["studies", "problems", "bindings"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
