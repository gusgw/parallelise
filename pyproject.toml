[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parallelise"
version = "0.1.0"
description = "Turn a serial Python notebook into a verified parallel C routine with a language-model agent, and measure how well different models and agent designs do it."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Angus Gray-Weale", email = "gusgw@gusgw.net"}]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=2",
]

[project.optional-dependencies]
# The two framework-based agent designs; the plain httpx agent needs nothing extra. These are
# pinned to exact versions, the ones the tests were run with, because a new release of a
# framework can change how an agent behaves and so what a run measures. The container image
# installs from this file, so the pins apply there too. To upgrade, change the versions
# together, run the whole test suite, and record the change. httpx2 is the HTTP library that
# Pydantic AI and the OpenAI library use, and that the Pydantic AI agent uses directly.
agents = [
    "pydantic-ai==2.55.0",
    "openai==3.29.0",
    "httpx2==2.13.1",
    "langgraph==1.2.14",
    "langchain==1.4.4",
    "langchain-openai==1.7.1",
    "langchain-core==1.6.10",
]
# the report generator's chart
report = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff==0.17.3", "matplotlib>=3.8", "mypy==2.4.1"]

[project.scripts]
parallelise = "parallelise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parallelise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# make `tests.fake_model_server` importable however pytest is launched
pythonpath = ["."]
markers = [
    "slow: builds and runs C code; needs gcc with OpenMP",
]
# A notice from Pydantic AI that something we use will be removed in its version 3 is an error
# in the tests, so that it is dealt with when it first appears.
filterwarnings = [
    "error:.*removed in v3.*:UserWarning",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["problems"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
