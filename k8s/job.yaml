# This file describes one conversion as a Kubernetes Job: one problem, on one backend, with one
# agent design. It holds four objects. A ConfigMap is a named set of settings; a Secret holds a
# value, such as a key, apart from the ordinary settings; a Job runs a task once, to completion;
# and a NetworkPolicy limits what the pod may reach over the network.
#
# Before you apply it, make three changes:
#   1. Build the image with "make image", push it to a registry that the cluster can reach,
#      and change both "image:" lines below to name it.
#   2. Set "gateway-url" and "model" in the ConfigMap, and the same host and port in the
#      NetworkPolicy at the end of this file.
#   3. Change the problem and the backend in "args", and the name of the Job.
# Then apply the objects, and follow the run's log, with:
#   kubectl apply -f k8s/job.yaml
#   kubectl logs -f job/parallelise-integrate-openmp
# The check "kubectl apply --dry-run=client -f k8s/job.yaml" should succeed unchanged.
#
# The file requests no graphics card, so it cannot run the CUDA backend. For that, build the
# image's "cuda" stage and give the container the limit nvidia.com/gpu: 1. Nor does the file
# provide a model: the model service must already be reachable from the pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: parallelise-config
data:
  # These two values reach the program as PARALLELISE_GATEWAY_URL and PARALLELISE_MODEL. The
  # address is an example, which names a Service called model-gateway in the namespace llm;
  # replace it with the in-cluster address of your own model service. The program's own
  # default, http://localhost:4000/v1, applies only when the variable is not set, and it would
  # reach a service only if one ran in the same pod.
  gateway-url: "http://model-gateway.llm.svc.cluster.local:4000/v1"
  # Replace this placeholder with the name of a model that the service offers.
  model: "replace-with-model-name"
---
# This Secret is optional. The key for the model service reaches the program as
# PARALLELISE_API_KEY; leave it empty when the service needs none. The containers mark their
# reference to it as optional, so the Job still starts if this Secret is deleted.
apiVersion: v1
kind: Secret
metadata:
  name: parallelise-secret
type: Opaque
stringData:
  api-key: ""
---
apiVersion: batch/v1
kind: Job
metadata:
  name: parallelise-integrate-openmp
spec:
  # A failed pod is not tried again, because a second attempt would spend more model requests
  # and would hide the first failure.
  backoffLimit: 0
  # Kubernetes stops the Job after one hour, whatever it is doing. This is the outer limit; the
  # program has its own, shorter time limits for the agent and for the judgement.
  activeDeadlineSeconds: 3600
  # The finished Job is deleted after a day, so that old Jobs do not accumulate. Read its log
  # before then.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: parallelise
    spec:
      # A container that stops is not restarted inside the same pod.
      restartPolicy: Never
      # The program never talks to the cluster, so the pod is given no service account token.
      automountServiceAccountToken: false
      # The pod must run as an ordinary user, the one built into the image (identifier 10001),
      # under the container runtime's default filter of system calls. fsGroup makes mounted
      # volumes writable by that user's group.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # This container runs the health check first, so that the Job stops early, before any
        # work is done, if the model service cannot be reached or does not offer the model.
        - name: health
          image: parallelise:cpu
          imagePullPolicy: IfNotPresent
          args: ["health"]
          env:
            - name: PARALLELISE_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: parallelise-config
                  key: gateway-url
            - name: PARALLELISE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: parallelise-config
                  key: model
            - name: PARALLELISE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: parallelise-secret
                  key: api-key
                  optional: true
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: parallelise
          image: parallelise:cpu
          imagePullPolicy: IfNotPresent
          # These are the arguments of the parallelise command. Change the problem and the
          # backend to run another conversion, and add "--model", "NAME" to override the
          # ConfigMap.
          args: ["run", "problems/integrate", "--backend", "openmp", "--agent", "basic"]
          env:
            - name: PARALLELISE_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: parallelise-config
                  key: gateway-url
            - name: PARALLELISE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: parallelise-config
                  key: model
            - name: PARALLELISE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: parallelise-secret
                  key: api-key
                  optional: true
            - name: PARALLELISE_WORK_ROOT
              value: /work
            - name: PARALLELISE_RESULTS
              value: /work/local-runs.jsonl
            - name: TMPDIR
              value: /work
            - name: HOME
              value: /work
          # The scheduler reserves the requests, and the limits cap the container: a runaway
          # program is slowed when it wants more processor time, and killed when it uses more
          # memory. These limits suit the conversion that this file describes, integrate on
          # OpenMP; larger problems need more memory, and more room in the work volume. The
          # judgement starts one worker for each processor that the pod may run on, and a
          # processor limit does not reduce that number.
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          # The container may not gain privileges, holds no Linux capabilities and has a
          # read-only root file system, so generated code cannot change the installed programs.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        # This volume is an empty scratch folder at /work, limited to 2Gi (two gibibytes), and
        # it is the only place where the containers can write. It holds the agent's work folder
        # and the run record, local-runs.jsonl, and it disappears with the pod. The files of a
        # finished pod cannot be copied out, so to keep the record, mount a persistent volume
        # here instead.
        - name: work
          emptyDir:
            sizeLimit: 2Gi
---
# Generated code runs inside the pod and could otherwise use the network. This allows the
# pod to reach only the model gateway (and the cluster's name service) and nothing else.
# The NetworkPolicy only takes effect if the cluster's network plugin enforces policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: parallelise-egress-gateway-only
spec:
  podSelector:
    matchLabels:
      app: parallelise
  policyTypes: ["Egress", "Ingress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm
          podSelector:
            matchLabels:
              app: model-gateway
      ports:
        - protocol: TCP
          port: 4000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
