name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the C compiler's MPI libraries
        run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - name: Install the package
        run: pip install ".[dev,report,agents]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/parallelise
      - name: Test (the CUDA tests skip themselves without a graphics card)
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: pytest -q -rs
