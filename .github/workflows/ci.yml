name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the C compiler's MPI libraries
        run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - name: Install the package
        run: pip install ".[dev,report,agents]"
      - name: Lint
        run: ruff check .
      - name: Test (the CUDA tests skip themselves without a graphics card)
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
          # The hosted runner has few shared cores, so the reference gates verify
          # correctness here and treat a missed speed-up floor as a skip, not a failure.
          PARALLELISE_SPEEDUP_UNRELIABLE: "1"
        run: pytest -q -rs

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the CPU image
        run: docker build --target cpu -t parallelise:cpu .
      - name: Check that the command starts
        run: docker run --rm parallelise:cpu --help
