[project]
name = "agent-min-improved"
version = "0.1.0"
description = "agent_min plus a finish gate and repeat-nudge (Phase 9 variant); reuses agent_min's tools so the only diff is the loop"
requires-python = ">=3.10"
dependencies = ["harness-common", "agent-min"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_min_improved"]

[tool.uv.sources]
harness-common = { path = "../common", editable = true }
agent-min = { path = "../agent_min", editable = true }
