[project]
name = "agent-min"
version = "0.1.0"
description = "Minimal hand-rolled agent loop over harness-common (httpx-only, no framework)"
requires-python = ">=3.10"
dependencies = ["harness-common"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_min"]

[tool.uv.sources]
harness-common = { path = "../common", editable = true }
