[project]
name = "agent-pydantic"
version = "0.1.0"
description = "Challenger deep agent: Pydantic AI over harness-common"
requires-python = ">=3.11"
dependencies = [
    "harness-common",
    "pydantic-ai>=1.106.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_pydantic"]

[tool.uv.sources]
harness-common = { path = "../common", editable = true }
