[project]
name = "agent-langgraph"
version = "0.1.0"
description = "Reference deep agent: LangGraph + deepagents over harness-common"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.8",
    "harness-common",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_langgraph"]

[tool.uv.sources]
harness-common = { path = "../common", editable = true }
