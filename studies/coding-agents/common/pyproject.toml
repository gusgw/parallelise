[project]
name = "harness-common"
version = "0.1.0"
description = "Shared httpx-only scaffolding for the harness agents"
requires-python = ">=3.10"
dependencies = ["httpx"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_common"]
